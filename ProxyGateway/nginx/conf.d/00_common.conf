# ============================================================
# ProxyGateway 全局通用配置 (由 00_ 前缀确保优先加载)
# ============================================================

# [WebSocket] 动态连接头映射
# 如果请求头包含 Upgrade (如 websocket)，则 Connection="Upgrade"
# 否则 Connection="close" (或 keep-alive，取决于 Nginx 默认行为，置空通常更安全)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# [Upload] 放大上传文件大小限制 (默认仅 1MB)
# 设置为 0 表示无限制，或设置具体值如 10240m
client_max_body_size 0;

# [Timeout] 延长代理超时 (默认 60s)
# 避免某些耗时接口或 WebSocket 长连接断开
proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# [Security] SSL 增强配置 (A+ 评级基石)
server_tokens off; # 不在响应头/错误页暴露 Nginx 版本
ssl_protocols TLSv1.2 TLSv1.3; # 禁用不安全的 TLS 1.0/1.1
# 仅保留 ECDHE 套件: DHE 套件需要单独配置 dhparam, 默认参数偏弱, 故不启用
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
add_header Strict-Transport-Security "max-age=31536000" always; # 开启 HSTS

# [Note] OCSP Stapling 保持关闭: Let's Encrypt 已宣布停止 OCSP 服务,
# 开启只会产生无意义的告警与重试 (A+ 评级不依赖它)
ssl_stapling off;
ssl_stapling_verify off;

# [Performance] Gzip 压缩
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1k; # 小于 1k 的响应不压缩, 省 CPU 且负优化小
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
