# 默认服务器块：处理未匹配域名的请求 (如直接用 IP 访问)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 返回简单提示页, 便于确认网关已正常运行 (不影响任何已配置的域名)
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>ProxyGateway</title></head><body style="font-family:sans-serif;text-align:center;padding-top:15%"><h1>&#128279; ProxyGateway is running</h1><p>网关运行中, 请使用已配置的域名访问。</p></body></html>';
}

# 默认 SSL 块：拒绝未配置域名的 HTTPS 握手 (防扫描)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 拒绝 SSL 握手 (需要 Nginx 1.19.4+)
    ssl_reject_handshake on;
}
