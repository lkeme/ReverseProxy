server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # [Modify] 你的域名
    server_name host-app.example.com;

    # [Modify] 证书路径: 文件名 = issue_cert.sh 签发时的域名参数
    #          签过泛域名证书的, 所有子域名统一填主域名 (如 example.com.pem)
    ssl_certificate     /etc/nginx/ssl/host-app.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/host-app.example.com.key;

    # 通用反代设置
    location / {
        # [Critical] host.docker.internal 由网关内置 host-gateway 映射指向宿主机
        proxy_pass http://host.docker.internal:10089; # [Modify] 宿主机端口

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket (使用全局 map 变量)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# HTTP 自动跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name host-app.example.com; # [Modify]
    rewrite ^(.*)$ https://$host$1 permanent;
}
