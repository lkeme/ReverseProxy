server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # [Modify] 你的域名
    server_name app.example.com;

    # [Modify] 证书路径: 文件名 = issue_cert.sh 签发时的域名参数
    #          签过泛域名证书的, 所有子域名统一填主域名 (如 example.com.pem)
    ssl_certificate     /etc/nginx/ssl/app.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/app.example.com.key;

    # 通用反代设置
    location / {
        # [Critical] 使用 Docker 内部 DNS (127.0.0.11) 实现动态解析
        # 防止子容器未启动导致网关崩溃
        resolver 127.0.0.11 valid=30s;
        set $upstream_app my_app_container; # [Modify] 你的容器名
        proxy_pass http://$upstream_app:80; # [Modify] 端口

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket (使用全局 map 变量)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# HTTP 自动跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com; # [Modify]
    rewrite ^(.*)$ https://$host$1 permanent;
}
