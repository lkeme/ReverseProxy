services:
  # 业务应用名称 (请修改)
  my-app:
    image: nginx:latest # [Modify] 替换为你的镜像 (如 ghcr.io/snailyp/gemini-balance:latest)
    container_name: my_app_container # [Modify] 必须唯一！Nginx 配置里要用到它
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # [Modify] 这里填入应用需要的环境变量
      # - PORT=3000
    volumes:
      # [Modify] 如果需要持久化数据，取消注释
      # - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true" # [Add] 允许被网关自动更新
    networks:
      - proxy_net
    # [Log] 限制日志大小
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # [Resource] 资源限制 (根据业务调整)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  # 必须加入网关网络，否则 Nginx 连不上
  proxy_net:
    external: true
